name: Deploy to selwynrailroadgroup.com

# Automatic deploys are OFF until the FTP account points at the selwynrailroadgroup.com folder.
# The previous FTP account opened in selwynfirecompany.com's folder and overwrote that site.
on:
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Upload over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Folder on the server that serves selwynrailroadgroup.com.
          # Default is public_html/. Override with a repository variable FTP_SERVER_DIR if your host differs.
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          # Set the repository variable FTP_PROTOCOL to "ftp" only if your host does not support FTPS.
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
